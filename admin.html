<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Admin — Albüm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500&family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171b34;
    --plum:#332a4d;
    --rose:#e893a8;
    --gold:#e8b75e;
    --cream:#fbf5ea;
    --lavender:#b6acd1;
    --line:rgba(251,245,234,0.14);
    --green:#6dbb8a;
    --red:#d9607a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Sora',sans-serif;
    font-weight:300;
    min-height:100vh;
  }

  /* ===== LOGIN ===== */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
    background:radial-gradient(ellipse at 50% 30%, rgba(232,147,168,0.12), transparent 65%);
  }
  .login-card{
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    border-radius:24px;
    padding:2.5rem 2rem;
    width:100%;
    max-width:380px;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,0.5);
    backdrop-filter:blur(8px);
  }
  .login-card .icon{font-size:2.6rem;margin-bottom:1rem;display:block;}
  .login-card h1{
    font-family:'Fraunces',serif;
    font-size:1.7rem;
    font-weight:500;
    margin-bottom:0.4rem;
  }
  .login-card p{color:var(--lavender);font-size:0.88rem;margin-bottom:1.8rem;}
  .field{
    display:flex;
    flex-direction:column;
    gap:0.45rem;
    margin-bottom:0.9rem;
    text-align:left;
  }
  .field label{
    font-family:'Space Mono',monospace;
    font-size:0.65rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .field input{
    background:rgba(255,255,255,0.06);
    border:1px solid var(--line);
    border-radius:12px;
    padding:0.9rem 1rem;
    color:var(--cream);
    font-family:'Sora',sans-serif;
    font-size:1rem;
    outline:none;
    transition:border-color 0.25s;
    width:100%;
    -webkit-appearance:none;
  }
  .field input:focus{border-color:rgba(232,147,168,0.5);}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:0.5rem;
    padding:0.95rem 1.8rem;
    border-radius:14px;
    border:none;
    font-family:'Sora',sans-serif;
    font-size:1rem;
    font-weight:500;
    cursor:pointer;
    transition:transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    -webkit-appearance:none;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:linear-gradient(135deg,#e893a8,#c96b87);color:#fff;width:100%;margin-top:0.4rem;}
  .btn-danger{background:linear-gradient(135deg,var(--red),#a03050);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--lavender);}
  .btn-ghost{background:transparent;border:none;color:var(--lavender);padding:0.5rem;}
  .login-error{
    color:var(--red);
    font-size:0.83rem;
    margin-top:0.7rem;
    min-height:1.2em;
  }

  /* ===== ADMIN PANEL ===== */
  #adminPanel{display:none;min-height:100vh;}

  .admin-header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(23,27,52,0.9);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:1rem 1.2rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:0.8rem;
  }
  .admin-header .brand{display:flex;align-items:center;gap:0.6rem;}
  .admin-header .brand .icon{font-size:1.4rem;}
  .admin-header h1{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:500;}
  .header-actions{display:flex;gap:0.5rem;align-items:center;}
  .header-actions .btn{padding:0.5rem 0.9rem;font-size:0.85rem;}
  .header-actions a{text-decoration:none;}

  .admin-body{padding:1.5rem 1.2rem;max-width:900px;margin:0 auto;}

  /* Stats */
  .stats-row{display:flex;gap:0.8rem;margin-bottom:1.8rem;flex-wrap:wrap;}
  .stat-card{
    flex:1;min-width:110px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1rem 1.2rem;
  }
  .stat-label{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:0.4rem;}
  .stat-value{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:500;}

  /* Upload zone */
  .upload-zone{
    border:2px dashed rgba(232,147,168,0.3);
    border-radius:20px;
    padding:2.5rem 1.5rem;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.3s,background 0.3s;
    position:relative;
    margin-bottom:1.8rem;
    background:rgba(232,147,168,0.02);
  }
  .upload-zone:active,.upload-zone.drag-over{
    border-color:var(--rose);
    background:rgba(232,147,168,0.06);
  }
  .upload-zone input[type="file"]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
    width:100%;
    height:100%;
    font-size:16px; /* prevents iOS zoom */
  }
  .upload-zone .uz-icon{font-size:2.4rem;display:block;margin-bottom:0.7rem;}
  .upload-zone p{color:var(--lavender);font-size:0.92rem;line-height:1.5;}
  .upload-zone strong{color:var(--rose);}

  /* Upload progress */
  .progress-bar-wrap{
    display:none;
    background:rgba(255,255,255,0.06);
    border-radius:999px;
    height:6px;
    margin-bottom:1.5rem;
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--rose),var(--gold));
    border-radius:999px;
    transition:width 0.3s ease;
    width:0%;
  }

  /* Preview strip */
  #previewBar{
    display:none;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line);
    border-radius:16px;
    padding:1.2rem;
    margin-bottom:1.5rem;
  }
  #previewBar h3{font-family:'Fraunces',serif;font-size:1rem;margin-bottom:0.8rem;color:var(--lavender);}
  .preview-list{display:flex;gap:0.6rem;flex-wrap:wrap;}
  .preview-item{
    position:relative;
    width:72px;height:72px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .preview-item img{width:100%;height:100%;object-fit:cover;}
  .preview-item .rm{
    position:absolute;top:2px;right:2px;
    width:20px;height:20px;
    background:rgba(217,96,122,0.9);
    border:none;border-radius:50%;
    color:#fff;font-size:0.75rem;
    cursor:pointer;display:flex;
    align-items:center;justify-content:center;
    line-height:1;padding:0;
  }
  .preview-actions{display:flex;gap:0.7rem;margin-top:0.9rem;flex-wrap:wrap;}
  .preview-actions .btn{padding:0.75rem 1.2rem;font-size:0.9rem;flex:1;min-width:120px;}

  /* Gallery */
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:0.6rem;}
  .section-header h2{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:500;}
  .badge{background:rgba(232,147,168,0.12);border:1px solid rgba(232,147,168,0.25);color:var(--rose);font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;padding:0.2rem 0.6rem;border-radius:999px;}

  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.8rem;}
  @media(min-width:480px){.gallery-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}}

  .gallery-item{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    aspect-ratio:1/1;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
  }
  .gallery-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery-item .del-btn{
    position:absolute;
    top:6px;right:6px;
    background:rgba(217,96,122,0.88);
    border:none;border-radius:8px;
    color:#fff;padding:0.3rem 0.5rem;
    font-size:0.75rem;cursor:pointer;
    opacity:0;transition:opacity 0.2s;
    backdrop-filter:blur(4px);
  }
  .gallery-item:hover .del-btn,
  .gallery-item:active .del-btn{opacity:1;}
  /* On mobile, always show delete button */
  @media(hover:none){.gallery-item .del-btn{opacity:0.85;}}

  .gallery-empty{
    color:var(--lavender);font-size:0.9rem;padding:2.5rem;
    border:1px dashed var(--line);border-radius:14px;text-align:center;
    grid-column:1/-1;
  }

  /* Toast */
  #toast{
    position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(10px);
    background:rgba(30,35,65,0.95);
    border:1px solid rgba(109,187,138,0.4);
    border-radius:12px;padding:0.8rem 1.4rem;
    color:var(--green);font-size:0.85rem;
    font-family:'Space Mono',monospace;letter-spacing:0.04em;
    white-space:nowrap;
    opacity:0;transition:opacity 0.3s,transform 0.3s;
    pointer-events:none;z-index:999;
    backdrop-filter:blur(8px);
    max-width:90vw;white-space:normal;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{border-color:rgba(217,96,122,0.4);color:var(--red);}

  /* Loading skeleton */
  .skeleton{
    background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.08) 50%,rgba(255,255,255,0.04) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
    border-radius:12px;
    aspect-ratio:1/1;
  }
  @keyframes shimmer{to{background-position:-200% 0;}}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen">
  <div class="login-card">
    <span class="icon">🔑</span>
    <h1>Admin Girişi</h1>
    <p>Albüme fotoğraf eklemek için giriş yap</p>

    <div class="field">
      <label>Kullanıcı Adı</label>
      <input type="text" id="loginUser" placeholder="kullanıcı adı" autocomplete="username" inputmode="text">
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Giriş Yap</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ===== ADMIN PANEL ===== -->
<div id="adminPanel">
  <div class="admin-header">
    <div class="brand">
      <span class="icon">💫</span>
      <h1>Albüm Yönetimi</h1>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn btn-outline">← Site</a>
      <button class="btn btn-ghost" onclick="doLogout()" title="Çıkış">⏻</button>
    </div>
  </div>

  <div class="admin-body">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Fotoğraf</div>
        <div class="stat-value" id="statCount">—</div>
      </div>
    </div>

    <!-- Upload Zone -->
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <span class="uz-icon">📷</span>
      <p><strong>Fotoğraf seç</strong></p>
      <p style="margin-top:0.35rem;font-size:0.78rem;opacity:0.7;">Galeriden veya kameradan seçebilirsin</p>
    </div>

    <!-- Progress -->
    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <!-- Preview -->
    <div id="previewBar">
      <h3>Seçilen fotoğraflar — yüklemeye hazır</h3>
      <div class="preview-list" id="previewList"></div>
      <div class="preview-actions">
        <button class="btn btn-primary" onclick="uploadAll()">✓ Albüme Ekle</button>
        <button class="btn btn-outline" onclick="clearPreview()">İptal</button>
      </div>
    </div>

    <!-- Gallery -->
    <div class="section-header">
      <h2>Albümdeki Fotoğraflar</h2>
      <span class="badge" id="photoCount">yükleniyor…</span>
    </div>
    <div class="gallery-grid" id="galleryGrid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
// ── AUTH TOKEN ────────────────────────────────────────────────
let authToken = sessionStorage.getItem('admin_token') || null;

async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;

  if (!user || !pass) { errEl.textContent = 'Lütfen tüm alanları doldur.'; return; }

  btn.textContent = 'Giriş yapılıyor…';
  btn.disabled = true;
  errEl.textContent = '';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user, pass }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Giriş başarısız');
    authToken = data.token;
    sessionStorage.setItem('admin_token', authToken);
    showPanel();
  } catch (err) {
    errEl.textContent = err.message;
    document.getElementById('loginPass').value = '';
  } finally {
    btn.textContent = 'Giriş Yap';
    btn.disabled = false;
  }
}

function doLogout() {
  sessionStorage.removeItem('admin_token');
  authToken = null;
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').textContent = '';
}

function showPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  loadGallery();
}

// Enter ile giriş
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') doLogin();
});

// Oturum kontrolü
if (authToken) showPanel();

// ── IMAGE COMPRESSION ─────────────────────────────────────────
function compressImage(file, maxW = 1400, quality = 0.85) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── FILE HANDLING ─────────────────────────────────────────────
let pending = []; // [{data, name}]

document.getElementById('fileInput').addEventListener('change', async function () {
  const files = Array.from(this.files).filter(f => f.type.startsWith('image/'));
  this.value = '';
  if (!files.length) return;
  await addFiles(files);
});

const uz = document.getElementById('uploadZone');
uz.addEventListener('dragover', e => { e.preventDefault(); uz.classList.add('drag-over'); });
uz.addEventListener('dragleave', () => uz.classList.remove('drag-over'));
uz.addEventListener('drop', async e => {
  e.preventDefault();
  uz.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  await addFiles(files);
});

async function addFiles(files) {
  for (const file of files) {
    const data = await compressImage(file);
    pending.push({ data, name: file.name.replace(/\.[^.]+$/, '') });
  }
  renderPreview();
}

function renderPreview() {
  const bar = document.getElementById('previewBar');
  const list = document.getElementById('previewList');
  bar.style.display = pending.length ? 'block' : 'none';
  list.innerHTML = '';
  pending.forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'preview-item';
    el.innerHTML = `<img src="${f.data}" alt="${f.name}">
      <button class="rm" onclick="removePending(${i})">&times;</button>`;
    list.appendChild(el);
  });
}

function removePending(i) { pending.splice(i, 1); renderPreview(); }
function clearPreview() { pending = []; renderPreview(); }

// ── UPLOAD ────────────────────────────────────────────────────
async function uploadAll() {
  if (!pending.length) return;

  const pw = document.getElementById('progressWrap');
  const pf = document.getElementById('progressFill');
  pw.style.display = 'block';
  pf.style.width = '0%';

  const total = pending.length;
  let done = 0;
  const items = [...pending];
  clearPreview();

  for (const item of items) {
    try {
      const res = await fetch('/api/photos', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken,
        },
        body: JSON.stringify({ data: item.data, caption: item.name }),
      });

      if (res.status === 401) { doLogout(); return; }
      if (!res.ok) throw new Error('Yükleme hatası');

      done++;
      pf.style.width = Math.round((done / total) * 100) + '%';
    } catch (err) {
      showToast('Bir fotoğraf yüklenemedi: ' + err.message, true);
    }
  }

  setTimeout(() => { pw.style.display = 'none'; pf.style.width = '0%'; }, 800);
  showToast(done + ' fotoğraf albüme eklendi ✓');
  loadGallery();
}

// ── GALLERY ───────────────────────────────────────────────────
async function loadGallery() {
  const grid = document.getElementById('galleryGrid');
  const count = document.getElementById('photoCount');
  const statCount = document.getElementById('statCount');

  grid.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

  try {
    const res = await fetch('/api/photos');
    if (!res.ok) throw new Error('API hatası');
    const photos = await res.json();

    count.textContent = photos.length + ' fotoğraf';
    statCount.textContent = photos.length;
    grid.innerHTML = '';

    if (!photos.length) {
      grid.innerHTML = '<div class="gallery-empty">Henüz fotoğraf yok.<br>Yukarıdan ekleyebilirsin.</div>';
      return;
    }

    photos.forEach(photo => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = `
        <img src="${photo.data}" alt="${photo.caption || 'Anı'}" loading="lazy">
        <button class="del-btn" onclick="deletePhoto('${photo._id}', this)">🗑</button>`;
      grid.appendChild(item);
    });
  } catch (err) {
    grid.innerHTML = '<div class="gallery-empty">Fotoğraflar yüklenemedi.<br>' + err.message + '</div>';
    statCount.textContent = '?';
    count.textContent = 'hata';
  }
}

async function deletePhoto(id, btn) {
  if (!confirm('Bu fotoğrafı silmek istediğine emin misin?')) return;
  btn.disabled = true;

  try {
    const res = await fetch('/api/photos?id=' + id, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + authToken },
    });
    if (res.status === 401) { doLogout(); return; }
    if (!res.ok) throw new Error((await res.json()).error || 'Silme hatası');
    btn.closest('.gallery-item').remove();
    const cur = parseInt(document.getElementById('statCount').textContent) || 1;
    document.getElementById('statCount').textContent = cur - 1;
    document.getElementById('photoCount').textContent = (cur - 1) + ' fotoğraf';
    showToast('Fotoğraf silindi.');
  } catch (err) {
    showToast(err.message, true);
    btn.disabled = false;
  }
}

// ── TOAST ─────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 3500);
}
</script>

</body>
</html>
