<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #171b34;
      color: #fbf5ea;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      user-select: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #e8b75e;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 14px;
      text-align: center;
    }

    .emoji {
      font-size: 28px;
      display: block;
      margin-bottom: 4px;
    }

    .name {
      font-weight: 600;
      font-size: 12px;
      color: #e893a8;
    }

    .status {
      font-size: 10px;
      color: #b6acd1;
      margin-top: 2px;
    }
  </style>
</head>

<body>
  <div class="header">
    <span>💫 Neşe & Mete</span>
    <span id="time">--:--</span>
  </div>

  <div class="grid">
    <div class="card">
      <span class="emoji" id="neseEmoji">🥰</span>
      <div class="name">Neşe</div>
      <div class="status" id="neseStatus">Çok Mutlu</div>
    </div>
    <div class="card">
      <span class="emoji" id="meteEmoji">💖</span>
      <div class="name" style="color:#b6acd1;">Mete</div>
      <div class="status" id="meteStatus">Aşık</div>
    </div>
  </div>

  <script>
    async function loadWidgetData() {
      try {
        const res = await fetch('/api/mood');
        const data = await res.json();
        if (data.nese) {
          document.getElementById('neseEmoji').textContent = data.nese.emoji || '🥰';
          document.getElementById('neseStatus').textContent = data.nese.text || 'Mutlu';
        }
        if (data.mete) {
          document.getElementById('meteEmoji').textContent = data.mete.emoji || '💖';
          document.getElementById('meteStatus').textContent = data.mete.text || 'Aşık';
        }
        document.getElementById('time').textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
      } catch (e) { }
    }
    loadWidgetData();
  </script>
</body>

</html>
